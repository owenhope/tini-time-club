<!-- @dsCard group="Colors" viewport="700x140" name="Green ramp" subtitle="Ink, surfaces and hover/press steps" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);padding:18px 20px;font:var(--type-body)}.grid{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:104px;border-radius:var(--radius-md);padding:10px;border:1px solid var(--line-hairline)}.n{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase}.h{font:var(--type-mono);letter-spacing:var(--tracking-mono);opacity:.75}</style>
</head><body><div class="grid">
<div class="sw" style="background:var(--green-900);color:var(--chartreuse-500)"><span class="n">900</span><span class="h">#1C3A2E</span></div>
<div class="sw" style="background:var(--green-800);color:var(--paper-050)"><span class="n">800 · hover</span><span class="h">#27493B</span></div>
<div class="sw" style="background:var(--green-700);color:var(--paper-050)"><span class="n">700 · brand</span><span class="h">#336654</span></div>
<div class="sw" style="background:var(--green-500);color:var(--paper-050)"><span class="n">500</span><span class="h">#4B8570</span></div>
<div class="sw" style="background:var(--green-300);color:var(--green-900)"><span class="n">300</span><span class="h">#8FB8A8</span></div>
<div class="sw" style="background:var(--green-100);color:var(--green-700)"><span class="n">100 · wash</span><span class="h">#DCE9E3</span></div>
</div></body></html>
