<!-- @dsCard group="Colors" viewport="700x160" name="Brand core" subtitle="The four brand colours — green, purple, chartreuse, pimento" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);padding:18px 20px;font:var(--type-body)}.grid{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:104px;border-radius:var(--radius-md);padding:10px;border:1px solid var(--line-hairline)}.n{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase}.h{font:var(--type-mono);letter-spacing:var(--tracking-mono);opacity:.75}</style>
</head><body><div class="grid">
<div class="sw" style="background:var(--green-700);color:var(--paper-050)"><span class="n">Green 700</span><span class="h">#336654</span></div>
<div class="sw" style="background:var(--purple-500);color:var(--green-700)"><span class="n">Purple 500</span><span class="h">#B6A3E2</span></div>
<div class="sw" style="background:var(--chartreuse-500);color:var(--green-700)"><span class="n">Chartreuse 500</span><span class="h">#F2FF71</span></div>
<div class="sw" style="background:var(--pimento-500);color:var(--paper-050)"><span class="n">Pimento 500</span><span class="h">#E8763D</span></div>
<div class="sw" style="background:var(--pimento-pink-500);color:var(--paper-050)"><span class="n">Pimento pink</span><span class="h">#EA6360</span></div>
</div></body></html>
