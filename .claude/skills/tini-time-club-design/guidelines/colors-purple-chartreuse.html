<!-- @dsCard group="Colors" viewport="700x140" name="Purple & chartreuse ramps" subtitle="Background and highlight steps" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);padding:18px 20px;font:var(--type-body)}.grid{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:104px;border-radius:var(--radius-md);padding:10px;border:1px solid var(--line-hairline)}.n{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase}.h{font:var(--type-mono);letter-spacing:var(--tracking-mono);opacity:.75}</style>
</head><body><div class="grid">
<div class="sw" style="background:var(--purple-700);color:var(--paper-050)"><span class="n">Purple 700</span><span class="h">#6B53A8</span></div>
<div class="sw" style="background:var(--purple-600);color:var(--paper-050)"><span class="n">600</span><span class="h">#8E76C9</span></div>
<div class="sw" style="background:var(--purple-500);color:var(--green-700)"><span class="n">500 · bg</span><span class="h">#B6A3E2</span></div>
<div class="sw" style="background:var(--purple-300);color:var(--green-700)"><span class="n">300</span><span class="h">#D3C7EE</span></div>
<div class="sw" style="background:var(--chartreuse-600);color:var(--green-700)"><span class="n">Chart. 600</span><span class="h">#D6E640</span></div>
<div class="sw" style="background:var(--chartreuse-500);color:var(--green-700)"><span class="n">500</span><span class="h">#F2FF71</span></div>
<div class="sw" style="background:var(--chartreuse-300);color:var(--green-700)"><span class="n">300</span><span class="h">#F7FFA8</span></div>
</div></body></html>
