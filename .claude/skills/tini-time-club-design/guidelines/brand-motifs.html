<!-- @dsCard group="Brand" viewport="700x230" name="Poster motifs" subtitle="Tilted lozenges, bento blocks, sticker, oversized numerals" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);padding:18px 20px;font:var(--type-body)}.wrap{display:grid;grid-template-columns:250px 1fr;gap:14px}.deep{background:var(--green-900);border-radius:var(--radius-xl);padding:20px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}.pill{border-radius:var(--radius-pill);padding:9px 22px;font:var(--weight-black) 26px/1 var(--font-display);letter-spacing:-.03em;white-space:nowrap}.bento{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:88px;gap:12px}.tile{border-radius:var(--radius-xl);padding:16px;display:flex;flex-direction:column;justify-content:center}.num{font:var(--weight-black) 44px/1 var(--font-display);letter-spacing:-.03em;color:var(--chartreuse-500)}.lab{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;opacity:.8}</style>
</head><body><div class="wrap">
<div class="deep">
<span class="pill" style="background:var(--chartreuse-500);color:var(--green-700);transform:rotate(-3deg)">Dirty</span>
<span class="pill" style="background:var(--green-700);color:var(--paper-050);transform:rotate(3deg);margin-left:26px">Dry</span>
<span class="pill" style="background:var(--paper-050);color:var(--green-700);transform:rotate(-3deg)">Gibson</span>
</div>
<div class="bento">
<div class="tile" style="background:var(--green-700);color:var(--paper-050)"><span class="lab">Reviews poured</span><span class="num">99.9k</span></div>
<div class="tile" style="background:url(../assets/photo-martini-lamp.jpg) center/cover;grid-row:span 2"></div>
<div class="tile" style="background:var(--chartreuse-500);color:var(--green-700)"><span style="font:var(--type-h3);letter-spacing:var(--tracking-heading)">Make it dirty</span></div>
</div>
</div></body></html>
