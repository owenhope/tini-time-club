<!-- @dsCard group="Colors" viewport="700x140" name="Neutrals" subtitle="Paper greys and ink — never pure black" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--surface-page);padding:18px 20px;font:var(--type-body)}.grid{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:104px;border-radius:var(--radius-md);padding:10px;border:1px solid var(--line-hairline)}.n{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase}.h{font:var(--type-mono);letter-spacing:var(--tracking-mono);opacity:.75}</style>
</head><body><div class="grid">
<div class="sw" style="background:var(--paper-000);color:var(--green-700)"><span class="n">Paper 000</span><span class="h">#FFFFFF</span></div>
<div class="sw" style="background:var(--paper-050);color:var(--green-700)"><span class="n">050 · page</span><span class="h">#FAF9F6</span></div>
<div class="sw" style="background:var(--paper-100);color:var(--green-700)"><span class="n">100</span><span class="h">#F2F1EE</span></div>
<div class="sw" style="background:var(--paper-200);color:var(--green-700)"><span class="n">200 · sheet</span><span class="h">#E5E6E8</span></div>
<div class="sw" style="background:var(--paper-300);color:var(--green-900)"><span class="n">300</span><span class="h">#CFD1D4</span></div>
<div class="sw" style="background:var(--ink-500);color:var(--paper-050)"><span class="n">Ink 500</span><span class="h">#6E7472</span></div>
<div class="sw" style="background:var(--ink-900);color:var(--paper-050)"><span class="n">Ink 900</span><span class="h">#141A17</span></div>
</div></body></html>
