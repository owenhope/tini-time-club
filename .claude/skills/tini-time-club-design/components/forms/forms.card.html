<!doctype html><html><head><meta charset="utf-8"><title>Forms</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-page);padding:18px 20px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:14px}.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--green-500)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { Input, SearchField, Select, Checkbox, Radio, Switch } = window.TiniTimeClubDesignSystem_1636c5;
function Demo(){
  const [q,setQ]=React.useState('bar basso');
  const [on,setOn]=React.useState(true);
  const [chk,setChk]=React.useState(true);
  const [p,setP]=React.useState('shaken');
  return(
  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'18px 22px'}}>
    <Input label="Bar name" icon="map-pin" placeholder="Where were you?" />
    <SearchField value={q} onChange={e=>setQ(e.target.value)} onClear={()=>setQ('')} style={{alignSelf:'end'}} />
    <Input label="Tasting notes" multiline rows={2} placeholder="Bracing. Ice cold. Three olives." />
    <div className="stack">
      <Select label="Base spirit" options={["Gin","Vodka","Dealer's choice"]} />
      <div className="row" style={{gap:18}}>
        <Radio name="p" label="Shaken" checked={p==='shaken'} onChange={()=>setP('shaken')} />
        <Radio name="p" label="Stirred" checked={p==='stirred'} onChange={()=>setP('stirred')} />
      </div>
    </div>
    <Input label="Price" error="That's not a number." value="six" />
    <div className="stack">
      <Checkbox label="Open now" checked={chk} onChange={()=>setChk(!chk)} />
      <Switch label="Tini time nudges" checked={on} onChange={()=>setOn(!on)} />
    </div>
  </div>)}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
