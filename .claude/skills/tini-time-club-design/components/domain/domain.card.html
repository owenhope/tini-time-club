<!doctype html><html><head><meta charset="utf-8"><title>Domain cards</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-page);padding:16px 20px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { MartiniCard, BarCard, ReviewCard } = window.TiniTimeClubDesignSystem_1636c5;
const PHOTO='../../assets/photo-martini-lamp.jpg';
function Demo(){
  const [liked,setLiked]=React.useState(false);
  return(
  <div style={{display:'grid',gridTemplateColumns:'240px 260px 1fr',gap:16,alignItems:'start'}}>
    <MartiniCard name="Dirty Gibson" bar="Bar Basso" city="Milan" rating={4.6} reviews={212} spirit="Gin" trending image={PHOTO} onClick={()=>{}} />
    <div style={{display:'flex',flexDirection:'column',gap:12}}>
      <BarCard name="Silver Lyan" area="Penn Quarter" distance="0.4 mi" rating={4.8} openNow regular image={PHOTO} onClick={()=>{}} />
      <BarCard name="The Long Pour" area="Shoreditch" distance="1.2 mi" rating={4.1} image={PHOTO} onClick={()=>{}} />
      <BarCard layout="tile" name="Coupe & Co" area="Bushwick" rating={4.4} openNow image={PHOTO} onClick={()=>{}} />
    </div>
    <ReviewCard author="Nadia Fereday" rank="Top shelf" when="2h ago" drink="Extra dirty, three olives"
      bar="Bar Basso · Milan" rating={5} notes="Cold enough to hurt. Brine-forward without going full seawater. The olives were the good kind."
      tags={["Extra dirty","Gin","Ice cold"]} likes={liked?43:42} comments={7} liked={liked} onLike={()=>setLiked(!liked)} />
  </div>)}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
