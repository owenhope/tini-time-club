name: Preview release (build + TestFlight)

on:
  # Manual: npx eas-cli workflow:run .eas/workflows/preview-release.yml
  workflow_dispatch: {}

jobs:
  build:
    name: Build iOS (preview)
    type: build
    params:
      platform: ios
      profile: preview

  submit:
    name: Submit to TestFlight
    needs: [build]
    type: submit
    env:
      # The first workflow run died in prepare_asc_api_key with "failed to
      # resolve submission config"; this makes the next failure legible.
      EXPO_DEBUG: "1"
    params:
      build_id: ${{ needs.build.outputs.build_id }}
      profile: preview
