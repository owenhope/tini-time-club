<!doctype html>
<html lang="en">
  <body style="margin:0; padding:0; background:#FAF9F6;">
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      border="0"
      style="background:#FAF9F6;"
    >
      <tr>
        <td align="center" style="padding:40px 20px;">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="max-width:520px; background:#FFFFFF; border:1px solid #E0E8E4; border-radius:16px;"
          >
            <tr>
              <td style="padding:40px 36px 8px;">
                <img
                  src="https://tinitimeclub.com/tini-time-logo.png"
                  width="88"
                  height="88"
                  alt="tini time club."
                  style="display:block; border:0;"
                />
              </td>
            </tr>

            <tr>
              <td style="padding:20px 36px 0;">
                <h1
                  style="margin:0; font-family:Arial,Helvetica,sans-serif; font-size:28px; line-height:34px; font-weight:800; color:#336654;"
                >
                  Tini Time
                </h1>
              </td>
            </tr>

            <tr>
              <td style="padding:14px 36px 0;">
                <p
                  style="margin:0; font-family:Arial,Helvetica,sans-serif; font-size:16px; line-height:25px; color:#6E7472;"
                >
                  Use this one-time link to sign back in to Tini Time Club.
                </p>
              </td>
            </tr>

            <tr>
              <td style="padding:28px 36px 0;">
                <a
                  href="{{ .ConfirmationURL }}"
                  style="display:block; padding:16px 24px; background:#6B53A8; border-radius:28px; font-family:Arial,Helvetica,sans-serif; font-size:16px; line-height:20px; font-weight:700; color:#FFFFFF; text-align:center; text-decoration:none;"
                >
                  Sign in to Tini Time Club
                </a>
              </td>
            </tr>

            <tr>
              <td style="padding:24px 36px 40px;">
                <p
                  style="margin:0; font-family:Arial,Helvetica,sans-serif; font-size:13px; line-height:20px; color:#8A918D;"
                >
                  This one-time link is just for you. If you didn&rsquo;t
                  request it, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>

          <p
            style="margin:20px 0 0; font-family:Arial,Helvetica,sans-serif; font-size:12px; line-height:18px; color:#8A918D;"
          >
            Tini Time Club
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
