<!doctype html>
<html lang="en">
  <body style="margin: 0; padding: 0; background: #faf9f6">
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      border="0"
      style="background: #faf9f6"
    >
      <tr>
        <td align="center" style="padding: 40px 20px">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            border="0"
            style="
              max-width: 520px;
              background: #ffffff;
              border: 1px solid #e0e8e4;
              border-radius: 16px;
            "
          >
            <tr>
              <td style="padding: 40px 36px 8px">
                <img
                  src="https://tinitimeclub.com/tini-time-logo.png"
                  width="88"
                  height="88"
                  alt="tini time club."
                  style="display: block; border: 0"
                />
              </td>
            </tr>

            <tr>
              <td style="padding: 20px 36px 0">
                <h1
                  style="
                    margin: 0;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 28px;
                    line-height: 34px;
                    font-weight: 800;
                    color: #336654;
                  "
                >
                  Welcome To The Club
                </h1>
              </td>
            </tr>

            <tr>
              <td style="padding: 14px 36px 0">
                <p
                  style="
                    margin: 0;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 16px;
                    line-height: 25px;
                    color: #6e7472;
                  "
                >
                  Confirm your email to create your Tini Time Club account and
                  start finding your next favorite Martini.
                </p>
              </td>
            </tr>

            <tr>
              <td style="padding: 28px 36px 0">
                <a
                  href="{{ .ConfirmationURL }}"
                  style="
                    display: block;
                    padding: 16px 24px;
                    background: #6b53a8;
                    border-radius: 28px;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 16px;
                    line-height: 20px;
                    font-weight: 700;
                    color: #ffffff;
                    text-align: center;
                    text-decoration: none;
                  "
                >
                  Join the Club
                </a>
              </td>
            </tr>

            <tr>
              <td style="padding: 24px 36px 40px">
                <p
                  style="
                    margin: 0;
                    font-family: Arial, Helvetica, sans-serif;
                    font-size: 13px;
                    line-height: 20px;
                    color: #8a918d;
                  "
                >
                  This one-time link is just for you. If you didn&rsquo;t
                  request it, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>

          <p
            style="
              margin: 20px 0 0;
              font-family: Arial, Helvetica, sans-serif;
              font-size: 12px;
              line-height: 18px;
              color: #8a918d;
            "
          >
            Tini Time Club
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
