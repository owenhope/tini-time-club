name: Main audit

# Main is the latest live source, including production OTA fixes. Development
# and preview validation is run manually on the branch being tested; this
# workflow audits only commits that have reached main.
on:
  push:
    branches: ["main"]

concurrency:
  group: main-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Repository audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      # app.config.ts reads env vars at evaluation time; a placeholder is
      # enough to prove the config still resolves.
      - name: Validate Expo config
        run: npx expo config --type public > /dev/null
        env:
          APP_ENV: production
          BACKEND_ENV: production
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          EXPO_PUBLIC_META_APP_ID: ci-placeholder
          EXPO_PUBLIC_SENTRY_DSN: https://public@example.ingest.sentry.io/1
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ci-placeholder
          GOOGLE_MAPS_API_KEY_IOS: ci-placeholder
          GOOGLE_MAPS_API_KEY_ANDROID: ci-placeholder
          SENTRY_ORG: ci-placeholder
          SENTRY_PROJECT: ci-placeholder
          SENTRY_AUTH_TOKEN: ci-placeholder

      - name: Install admin dependencies
        run: npm ci --prefix admin

      - name: Typecheck admin
        run: npm run typecheck --prefix admin

      - name: Test admin
        run: npm test --prefix admin

      - name: Lint admin
        run: npm run lint --prefix admin

      - name: Build admin
        run: npm run build --prefix admin
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          ADMIN_PASSWORD: ci-placeholder
          SESSION_SECRET: ci-placeholder-session-secret
